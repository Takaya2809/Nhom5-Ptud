<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental Clinic Management System - Class Diagram (Chuẩn Hóa)</title>
  <style>
    :root {
      --primary: #1976D2;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #38BDF8;
    }
    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #2563EB;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn:hover { background: #1D4ED8; }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover { background: #475569; }
    main {
      flex: 1;
      position: relative;
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #viewport {
      width: 100%;
      height: 100%;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    #viewport:active { cursor: grabbing; }
    #diagram-img {
      max-width: none;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: white;
      border-radius: 8px;
    }
    .floating-toolbar {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 10;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.15s;
    }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .zoom-level {
      font-size: 0.8rem;
      font-weight: 600;
      min-width: 48px;
      text-align: center;
      color: #38BDF8;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Dental Clinic Management System — Class Diagram</h1>
      <p>Bản vẽ UML chuẩn hóa hướng đối tượng (OOP) — Đã khắc phục toàn bộ lỗi thiết kế</p>
    </div>
    <div class="controls">
      <a class="btn btn-secondary" href="Dental Clinic Management System Class Diagram Fixed.png" download>Tải ảnh PNG</a>
      <a class="btn btn-secondary" href="Dental Clinic Management System Class Diagram Fixed.svg" download>Tải file SVG</a>
      <a class="btn" href="Dental_Clinic_Class_Diagram_Fixed.puml" target="_blank">Xem mã PlantUML</a>
    </div>
  </header>

  <main>
    <div id="viewport">
      <img id="diagram-img" src="Dental Clinic Management System Class Diagram Fixed.svg" alt="Dental Clinic Management System Class Diagram">
    </div>

    <div class="floating-toolbar">
      <button class="tool-btn" id="zoom-out" title="Thu nhỏ">-</button>
      <span class="zoom-level" id="zoom-text">100%</span>
      <button class="tool-btn" id="zoom-in" title="Phóng to">+</button>
      <button class="tool-btn" id="zoom-reset" title="Đặt lại">↺</button>
    </div>
  </main>

  <script>
    const img = document.getElementById('diagram-img');
    const zoomText = document.getElementById('zoom-text');
    let scale = 1.0;

    function updateZoom() {
      img.style.transform = `scale(${scale})`;
      zoomText.textContent = `${Math.round(scale * 100)}%`;
    }

    document.getElementById('zoom-in').onclick = () => {
      scale = Math.min(scale + 0.15, 3.0);
      updateZoom();
    };

    document.getElementById('zoom-out').onclick = () => {
      scale = Math.max(scale - 0.15, 0.3);
      updateZoom();
    };

    document.getElementById('zoom-reset').onclick = () => {
      scale = 1.0;
      updateZoom();
    };

    window.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        if (e.deltaY < 0) scale = Math.min(scale + 0.1, 3.0);
        else scale = Math.max(scale - 0.1, 0.3);
        updateZoom();
      }
    }, { passive: false });
  </script>
</body>
</html>
